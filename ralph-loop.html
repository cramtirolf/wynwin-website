<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ralph Loop</title>
<meta name="robots" content="noindex, nofollow">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Helvetica, Arial, sans-serif;
    position: relative;
    padding: 40px 24px;
    box-sizing: border-box;
  }
  .logo {
    position: fixed;
    top: 24px;
    right: 24px;
    height: 32px;
    width: auto;
  }
  .message {
    color: #fff;
    font-weight: 800;
    font-size: clamp(24px, 4vw, 44px);
    line-height: 1.3;
    text-align: center;
    max-width: 900px;
    margin: 0 0 40px;
  }
  .diagram {
    max-width: min(90vw, 700px);
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <img class="logo" src="assets/ralph-loop-logo.png" alt="WynWin">
  <p class="message">What are you doing here? I told you NOT to work with Ralph!</p>
  <img class="diagram" src="assets/ralph-loop-diagram.png" alt="Ralph loop diagram">
</body>
</html>
