<title>WynWin — Business Agility &amp; AI Adoption</title>
<meta name="description" content="WynWin advises executive teams on business agility and AI adoption across insurance, banking, pharma, telecom and government.">

<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--ink-950:oklch(0.16 0.018 265);--ink-900:oklch(0.21 0.02 265);--ink-800:oklch(0.28 0.018 265);
--ink-700:oklch(0.37 0.016 265);--ink-600:oklch(0.47 0.014 265);--ink-500:oklch(0.57 0.012 265);
--ink-400:oklch(0.67 0.01 265);--ink-300:oklch(0.78 0.008 265);--ink-200:oklch(0.88 0.006 265);
--ink-100:oklch(0.94 0.004 265);--ink-50:oklch(0.975 0.003 90);--paper:oklch(0.985 0.005 90);
--oxblood-700:oklch(0.32 0.135 25);--oxblood-600:oklch(0.40 0.155 25);--oxblood-500:oklch(0.47 0.165 25);
--oxblood-100:oklch(0.93 0.03 25);
--bg-sunken:var(--ink-50);--bg-inverse:var(--ink-950);
--text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-muted:var(--ink-400);
--text-accent:var(--oxblood-600);--border-subtle:var(--ink-100);--border-strong:var(--ink-700);
--accent-primary:var(--oxblood-600);--accent-primary-hover:var(--oxblood-700);
--font-display:'Newsreader',Georgia,serif;--font-sans:'Archivo',Helvetica,Arial,sans-serif;
--font-mono:'IBM Plex Mono',ui-monospace,monospace;
--text-display-xl:4.25rem;--text-display-md:2rem;--text-display-sm:1.5rem;--text-body-lg:1.125rem;--text-body-md:1rem;
--leading-tight:1.1;--leading-snug:1.3;--leading-normal:1.55;
--radius-xs:2px;--radius-md:6px;--container-pad:clamp(24px,4vw,64px);--content-max:1120px;
--duration-base:180ms;--ease-standard:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--text-primary);font-family:var(--font-sans);}
a{color:var(--text-accent);text-decoration:none;}
a:hover{color:var(--accent-primary-hover);}
.wrap{max-width:var(--content-max);margin:0 auto;}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-accent);margin-bottom:16px;}
.btn{font-family:var(--font-sans);font-weight:600;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;border-radius:var(--radius-xs);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;padding:16px 30px;transition:background var(--duration-base) var(--ease-standard),color var(--duration-base) var(--ease-standard),border-color var(--duration-base) var(--ease-standard);}
.btn-primary{background:var(--accent-primary);color:var(--paper);}
.btn-primary:hover{background:var(--accent-primary-hover);color:var(--paper);}
.btn-outline{background:transparent;color:var(--text-primary);border-color:var(--border-strong);}
.btn-outline:hover{background:var(--ink-50);}
.btn-sm{padding:8px 16px;font-size:12px;}
.badge{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-xs);padding:5px 12px;display:inline-block;}
.card{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:20px 24px;background:#fff;}
.card .card-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-accent);margin-bottom:8px;}
.card .card-title{font-family:var(--font-display);font-size:1.15rem;margin:0 0 6px;}
.card p{font-family:var(--font-sans);font-size:14px;color:var(--text-secondary);margin:0;line-height:1.5;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--text-primary);}
.field input{font-family:var(--font-sans);font-size:15px;padding:14px 16px;border:1px solid var(--ink-200);border-radius:var(--radius-xs);background:#fff;color:var(--text-primary);}
.field input:focus{outline:none;border-color:var(--oxblood-500);box-shadow:0 0 0 3px var(--oxblood-100);}
</style>
